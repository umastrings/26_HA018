### ekf_real.yaml — 실물용 EKF (robot_localization)
### ekf_mecanum.yaml(시뮬용)의 실물 포크.
###   차이는 use_sim_time 뿐 — 노드/토픽/융합 구성은 동일하게 유지(이관비용 0).
###   ★ /odom_raw 는 실물에선 serial_bridge_node 가 발행(엔코더 FK).
###     시뮬에선 planar_move 플러그인이 발행. 토픽·프레임 동일 → 같은 EKF 설정 재사용.
###
### ⚠️ rcl 파서 규칙: covariance 배열은 전부 float(0.0)로. int 섞이면 파싱 중단.
/**:
  ros__parameters:
    use_sim_time: false        # ★ 실물: false (시뮬용과 유일한 차이)

    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true           # EKF가 odom->base_footprint TF 소유
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 휠 오도메트리 (serial_bridge /odom_raw) — vx, vy 사용
    # ★ 9/1 원복 — IMU(ESP32 #1) 장착 후 yaw/vyaw는 IMU가 전담(메카넘 슬립에
    #   더 강함, 명세서 §3.3). odom0의 vyaw(index 11)를 다시 켜두면 IMU와
    #   휠오도가 동시에 yaw를 줘서 EKF 융합이 충돌하므로 false로 되돌린다.
    #   (8/29에는 IMU 미연결이라 임시로 true였음 — 그 근거는 사라짐)
    odom0: /odom_raw
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    # IMU (BNO055, ESP32#1 → serial_bridge /imu/data) — yaw, yaw_rate만 사용
    imu0: /imu/data
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

